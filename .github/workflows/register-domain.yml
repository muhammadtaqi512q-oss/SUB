name: Auto Register Custom Domain

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  register-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Request Domain from Sitey (Tokenless API)
        run: |
          echo "Domain request bheji ja rahi hai..."
          RESPONSE=$(curl -s -X POST https://sitey.my/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{
              "jsonrpc": "2.0",
              "method": "create_subdomain",
              "params": {
                "type": "CNAME",
                "value": "muhammadtaqi512q-oss.github.io",
                "domain": "sitey.my",
                "subdomain": "lyramoon-studio"
              },
              "id": 1
            }')
            
          echo "API Response: $RESPONSE"
          
          # Check agar error aya toh workflow fail na ho, bas aage badh jaye
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "⚠️ Sitey API ne error diya. Ho sakta hai domain pehle se bana ho ya service down ho."
          else
            echo "✅ Domain request successfully bhej di gayi hai!"
          fi

      - name: Set Custom Domain in CNAME file
        run: |
          # CNAME file banayein taake GitHub Pages isay read kare
          echo "lyramoon-studio.sitey.my" > CNAME
          
      - name: Commit and Push CNAME
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CNAME
          git commit -m "Auto-set custom domain to lyramoon-studio.sitey.my" || echo "No changes to commit"
          git push
